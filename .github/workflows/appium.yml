name: Appium Tests

on:
  workflow_dispatch:

jobs:
  run-tests:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Node
        run: node -v

      - name: Verify NPM
        run: npm -v

      - name: Verify Device
        run: adb devices

      - name: Install Dependencies
        run: npm install

      - name: Run Tests
        run: npm run tests_with_reports